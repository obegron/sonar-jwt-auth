name: release
on: {push: {tags: ["v*"]}}
permissions: {contents: write, packages: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: scripts/fetch-server-jar.sh
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: mvn -B versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false && mvn -B verify
      - run: cp target/sonar-jwt-auth-$VERSION.jar docker/sonar-jwt-auth.jar
      - name: Publish init-container image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/${{ github.repository_owner }}/sonar-jwt-auth-init
          docker build -t $img:$VERSION -f docker/Dockerfile.init docker && docker push $img:$VERSION
      - uses: softprops/action-gh-release@v2
        with: {files: "target/sonar-jwt-auth-*.jar", generate_release_notes: true}
