name: release
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
    inputs:
      version: {description: "version to build (dry run: builds and tests, publishes nothing)", default: "0.0.0-dryrun"}
permissions: {contents: write, packages: write}
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Tag must be on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "refusing to release a commit that is not on main"; exit 1; }
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: pip install cryptography
      - run: scripts/fetch-server-jar.sh
      - name: Version
        env:
          RAW_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          v="${RAW_VERSION#v}"
          [[ "$v" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "bad version"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: mvn -B versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false && mvn -B verify
      - run: scripts/integration/run.sh
      - run: cp target/sonar-jwt-auth-$VERSION.jar docker/sonar-jwt-auth.jar
      - name: Build init-container image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/sonar-jwt-auth-init:$VERSION -f docker/Dockerfile.init docker
      - name: Publish image
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/sonar-jwt-auth-init:$VERSION
      - uses: softprops/action-gh-release@v3
        if: env.PUBLISH == 'true'
        with: {files: "target/sonar-jwt-auth-*.jar", generate_release_notes: true}
