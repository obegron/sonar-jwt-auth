name: release
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
    inputs:
      version: {description: "version to build (dry run: builds and tests, publishes nothing)", default: "0.0.0-dryrun"}
permissions: {contents: write, packages: write}
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: pip install cryptography
      - run: scripts/fetch-server-jar.sh
      - name: Version
        run: echo "VERSION=${{ github.event_name == 'push' && github.ref_name || inputs.version }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - run: mvn -B versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false && mvn -B verify
      - run: scripts/integration/run.sh
      - run: cp target/sonar-jwt-auth-$VERSION.jar docker/sonar-jwt-auth.jar
      - name: Build init-container image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/sonar-jwt-auth-init:$VERSION -f docker/Dockerfile.init docker
      - name: Publish image
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/sonar-jwt-auth-init:$VERSION
      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'true'
        with: {files: "target/sonar-jwt-auth-*.jar", generate_release_notes: true}
