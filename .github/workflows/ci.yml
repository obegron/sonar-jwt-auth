name: ci
on: {push: {branches: [main]}, pull_request: {}}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # compile + unit-test against each SonarQube Community Build we claim to support
        sonarqube: ["26.9.0.129388-community", "26.10.0.133078-community", "26.11.0.134175-community"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: scripts/fetch-server-jar.sh sonarqube:${{ matrix.sonarqube }}
      - run: mvn -B verify
  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: pip install cryptography
      - run: scripts/fetch-server-jar.sh
      - run: mvn -B -DskipTests package
      - run: scripts/integration/run.sh
