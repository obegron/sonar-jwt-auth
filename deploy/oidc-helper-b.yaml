# Second cluster ("jenkins" stand-in): helper is published on a NodePort so SonarQube in the other cluster can reach it.
# Republishes this cluster's OIDC discovery + JWKS so SonarQube (any cluster/host) can fetch it.
apiVersion: v1
kind: ServiceAccount
metadata: {name: oidc-helper, namespace: default}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oidc-helper, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: oidc-helper}}
  template:
    metadata: {labels: {app: oidc-helper}}
    spec:
      serviceAccountName: oidc-helper
      containers:
      - name: oidc-helper
        image: oidc-helper:dev
        imagePullPolicy: IfNotPresent
        env:
        - {name: OIDC_MODE, value: proxy}
        - {name: PORT, value: "8080"}
        - {name: ENVIRONMENT_BASE_URL, value: "http://host.k3d.internal:19092"}
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: oidc-helper, namespace: default}
spec:
  selector: {app: oidc-helper}
  type: NodePort
  ports: [{port: 8080, targetPort: 8080, nodePort: 30902}]
