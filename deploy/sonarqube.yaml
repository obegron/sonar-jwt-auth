apiVersion: apps/v1
kind: Deployment
metadata: {name: sonarqube, namespace: default}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: sonarqube}}
  template:
    metadata: {labels: {app: sonarqube}}
    spec:
      initContainers:
      - name: sysctl
        image: busybox
        command: ["sh","-c","true"]
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: sonarqube-data}}
      - {name: jwt-auth-config, configMap: {name: jwt-auth-config}}
      containers:
      - name: sonarqube
        image: sonar-oidc-test:dev
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 9000}]
        env:
        - {name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE, value: "true"}
        - {name: SONAR_WEB_JAVAADDITIONALOPTS, value: "-javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.10.0.jar=web -javaagent:/opt/sonarqube/extensions/sonar-jwt-auth.jar=web"}
        - {name: SONAR_CE_JAVAADDITIONALOPTS, value: "-javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.10.0.jar=ce"}
        volumeMounts:
        - {name: data, mountPath: /opt/sonarqube/data}
        - {name: jwt-auth-config, mountPath: /opt/sonarqube/conf/jwt-auth.json, subPath: jwt-auth.json}
        readinessProbe:
          httpGet: {path: /api/system/status, port: 9000}
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: sonarqube, namespace: default}
spec:
  type: NodePort
  selector: {app: sonarqube}
  ports: [{port: 9000, targetPort: 9000, nodePort: 30900}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sonarqube-data, namespace: default}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
